[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rsi-sitemind-core"
version = "0.1.0"
description = "Evidence-governed RSI SiteMind control plane"
requires-python = ">=3.11"
dependencies = ["cryptography>=42", "jsonschema>=4.20"]

[tool.setuptools.packages.find]
where = ["src"]
